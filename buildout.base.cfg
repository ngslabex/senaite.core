[buildout]
index = https://pypi.org/simple/
extends = https://dist.plone.org/release/5.2-latest/versions.cfg
find-links =
    https://dist.plone.org/release/5.2-latest/
    https://dist.plone.org/thirdparty/

parts =
    instance
    test
    omelette
    i18ndude
    zopepy
    write_code_headers

eggs =
    senaite.lims
    senaite.patient
    senaite.jsonapi
    senaite.databox
    senaite.storage
    senaite.ldap
    senaite.diagnosis
    senaite.referral
#    senaite.indexer
#    senaite.monkeypatches
    RelStorage
    pg8000
    collective.recipe.plonesite

    plone.reload
    Products.PrintingMailHost

extensions = mr.developer

versions = versions
show-picked-versions = true

plone-user = admin:admin

develop = .
sources = sources
auto-checkout = *

[sources]
senaite.core = git https://github.com/ngslabex/senaite.core.git branch=2.6.5
senaite.app.listing = git https://github.com/ngslabex/senaite.app.listing.git branch=2.x
senaite.app.spotlight = git https://github.com/ngslabex/senaite.app.spotlight.git branch=2.x
senaite.app.supermodel = git https://github.com/ngslabex/senaite.app.supermodel.git branch=2.x
senaite.databox = git https://github.com/ngslabex/senaite.databox.git branch=master
senaite.impress = git https://github.com/ngslabex/senaite.impress.git branch=2.x
senaite.jsonapi = git https://github.com/ngslabex/senaite.jsonapi.git  branch=2.x
senaite.lims = git https://github.com/ngslabex/senaite.lims.git branch=2.x
senaite.storage = git https://github.com/ngslabex/senaite.storage.git branch=2.x
senaite.patient = git https://github.com/ngslabex/senaite.patient.git branch=master
senaite.ldap = git https://github.com/ngslabex/senaite.ldap.git branch=master
senaite.diagnosis = git https://github.com/ngslabex/senaite.diagnosis.git branch=master
senaite.referral = git https://github.com/ngslabex/senaite.referral.git branch=2.x

[instance]
recipe = plone.recipe.zope2instance
http-address = 127.0.0.1:8080
user = ${buildout:plone-user}
wsgi = off
eggs =
    Plone
    plone.app.upgrade
    ${buildout:package-name}
    ${buildout:eggs}
deprecation-warnings = on
environment-vars =
    zope_i18n_compile_mo_files true
zcml =

[i18ndude]
unzip = true
recipe = zc.recipe.egg
eggs = i18ndude

[write_code_headers]
recipe = collective.recipe.template
output = ${buildout:directory}/bin/write_code_headers
input = ${buildout:directory}/templates/write_code_headers.py.in
mode = 755

[test]
recipe = zc.recipe.testrunner
defaults = ['--auto-color', '--auto-progress']
eggs =
    ${buildout:package-name} [test]

[omelette]
recipe = collective.recipe.omelette
eggs = ${buildout:eggs}

[zopepy]
recipe = zc.recipe.egg
eggs = ${instance:eggs}
interpreter = zopepy
scripts = zopepy

[versions]
# versions taken from requirements.txt
setuptools = 44.1.1
#zc.buildout =
#setuptools = 42.0.2
#senaite.lims = 2.5.0
zc.buildout=3.3
Werkzeug = 1.0.1
cryptography = 3.3.2
bobtemplates.plone=5.2.2
isort=4.3.21
regex = 2021.3.17
#senaite.core = 2.5.0
et-xmlfile = 1.0.1
RelStorage = 2.1.1
pg8000 = 1.12.5
perfmetrics = 3.3.0
zodbpickle = 2.6
BTrees = 4.11.3